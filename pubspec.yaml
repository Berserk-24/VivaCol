name: vivacol
description: VivaCol - Plataforma inmobiliaria colaborativa con estado tipo semaforo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.5+1
  image_picker: ^1.2.4
  http: ^1.6.0
  google_maps_flutter: ^2.18.2
  geocoding: ^5.0.0
  video_player: ^2.14.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/Intro-VivaCol.mp4

flutter_launcher_icons:
  image_path: "assets/icon/logo.png"
  android: true
  web:
    generate: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"
